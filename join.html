<!DOCTYPE html>
<html>

<head>

<title>Join G-WIN</title>

<link rel="stylesheet" href="style.css">

<script type="module" src="firebase.js"></script>

</head>

<body>

<section class="login">

<h2>Join the Network</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="signUp()">Create Account</button>

<button onclick="login()">Login</button>

</section>
<!-- Firebase App (always required) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>

<!-- Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

<script> const firebaseConfig = {
  apiKey: "AIzaSyD2zv3-hzcb3RiqYDhbZAEnj1Spka9ONmw",
  authDomain: "g-win-3e858.firebaseapp.com",
  projectId: "g-win-3e858",
  storageBucket: "g-win-3e858.firebasestorage.app",
  messagingSenderId: "943145467795",
  appId: "1:943145467795:web:baa679a097334fc5e77266"
};
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// Sign up function
function signUp() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => alert("Account created!"))
    .catch(err => alert(err.message));
}

// Login function
function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => window.location = "dashboard.html")
    .catch(err => alert(err.message));
}
</script>

<script>
auth.onAuthStateChanged(user => {
  if (!user) {
    alert("Please log in first!");
    window.location = "join.html";
  }
});
</script>
</body>
</html>
