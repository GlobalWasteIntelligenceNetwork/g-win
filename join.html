<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Join</title>

<link rel="stylesheet" href="style.css">

<!-- ✅ Firebase MUST be here -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

</head>

<body>

<nav class="nav">

<div class="logo-container">
  <a href="index.html" class="logo-text">G-WIN</a>
  <img src="logo.png" class="logo-img">
</div>

<div class="menu">
<a href="index.html">Home</a>
<a href="join.html">Join</a>
<a href="dashboard.html">Dashboard</a>
</div>

</nav>

<section class="login">
  
<h2>Join</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signUp()">Create Account</button>
<button onclick="login()">Login</button>

<!-- ✅ Your script at the BOTTOM -->
<script>

const firebaseConfig = {
  apiKey: "AIzaSyD2zv3-hzcb3RiqYDhbZAEnj1Spka9ONmw",
  authDomain: "g-win-3e858.firebaseapp.com",
  projectId: "g-win-3e858",
  storageBucket: "g-win-3e858.firebasestorage.app",
  messagingSenderId: "943145467795",
  appId: "1:943145467795:web:baa679a097334fc5e77266"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

function signUp(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

auth.createUserWithEmailAndPassword(email,password)
.then(()=>{
alert("Account created!");
window.location.href = "dashboard.html";
})
.catch((error)=>{
alert(error.message);
});
}

function login(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,password)
.then(()=>{
alert("Login successful!");
window.location.href = "dashboard.html";
})
.catch((error)=>{
alert(error.message);
});
}

</script>

</body>
</html>
