<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Join G-WIN</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

</head>

<body>

<section class="login">

<h2>Join the Network</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="signUp()">Create Account</button>

<button onclick="login()">Login</button>

</section>

<script>

= {
  apiKey: "AIzaSyD2zv3-hzcb3RiqYDhbZAEnj1Spka9ONmw",
  authDomain: "g-win-3e858.firebaseapp.com",
  projectId: "g-win-3e858",
  storageBucket: "g-win-3e858.firebasestorage.app",
  messagingSenderId: "943145467795",
  appId: "1:943145467795:web:baa679a097334fc5e77266"};// Initialize Firebaseconst app = initializeApp(firebaseConfig



);

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

function signUp(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

auth.createUserWithEmailAndPassword(email,password)
.then((userCredential)=>{

alert("Account created!");

window.location.href = "dashboard.html";

})
.catch((error)=>{

alert(error.message);

});

}

function login(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,password)
.then((userCredential)=>{

alert("Login successful!");

window.location.href = "dashboard.html";

})
.catch((error)=>{

alert(error.message);

});

}

</script>

</body>
</html>
