<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>G-WIN Application</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>

<body>

<h1>Join G-WIN</h1>

<form id="applicationForm">

<input placeholder="Full Name" required>

<label>Date of Birth</label>
<input type="date" required>

<label>Gender</label>
<select required>
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
<option>Prefer not to say</option>
</select>

<input placeholder="Region / Country" required>

<input type="email" placeholder="Email" required>

<h3>Guardian Information</h3>
<input placeholder="Guardian Name" required>
<input placeholder="Guardian Contact (Email)" required>

<h3>Education (Student)</h3>
<input placeholder="Grade" optional>
<input placeholder="School Year Average (your country format)" optional>

<h3>Motivation</h3>
<textarea maxlength="100" placeholder="In a brief paragraph (max. 100 words), describe what drives your passion for environmental change and how you hope to make an impact." required></textarea>

<label>
<input type="checkbox" required>
I consent to G-WIN collecting and using my information for application and communication purposes.
</label>

<button type="submit">Submit Application</button>

</form>

<script>
// Initialize EmailJS
(function(){
emailjs.init("4NwtAQCquOAMaqEbO");
})();

// Initialize Firebase
const firebaseConfig = {
apiKey: "AIzaSyD2zv3-hzcb3RiqYDhbZAEnj1Spka9ONmw",
authDomain: "g-win-3e858.firebaseapp.com",
projectId: "g-win-3e858",
storageBucket: "g-win-3e858.firebasestorage.app",
messagingSenderId: "943145467795",
appId: "1:943145467795:web:baa679a097334fc5e77266"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Handle form submit
document.getElementById("applicationForm").addEventListener("submit", function(e){
e.preventDefault();

const data = {
name: document.querySelector('input[placeholder="Full Name"]').value,
dob: document.querySelector('input[type="date"]').value,
gender: document.querySelector('select').value,
region: document.querySelector('input[placeholder="Region / Country"]').value,
email: document.querySelector('input[type="email"]').value,
guardian: document.querySelector('input[placeholder="Guardian Name"]').value,
guardianContact: document.querySelector('input[placeholder="Guardian Contact (Email)"]').value,
grade: document.querySelector('input[placeholder="Grade"]').value,
average: document.querySelector('input[placeholder="School Year Average (your country format)"]').value,
motivation: document.querySelector('textarea').value,
timestamp: new Date()
};

// Save to Firebase
db.collection("applications").add(data)
.then(() => {

emailjs.send("service_h3ct7gl", "__ejs-test-mail-service__", data)
.then(function(response){
console.log("Email sent", response);
})
.catch(function(error){
console.log("Email error", error);
});

// Redirect after submit
window.location.href = "submitted.html";

})
.catch((error)=>{
alert("Error saving application: " + error.message);
});

});
</script>
</body>
</html>
